name: Apply conversion QA

on:
  push:
    branches:
      - conversion-qa-2026-08-20

permissions:
  contents: write

jobs:
  apply-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conversion-qa-2026-08-20
          fetch-depth: 0

      - name: Apply conversion and keyword QA
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # 1) Homepage: strengthen visible commercial intent and price transparency.
          p = 'src/pages/index.astro'
          text = read(p)
          text = replace_once(
              text,
              'Free review. No pressure. No monthly membership.',
              'Free review. One-time pricing starts at $199. No monthly membership.',
              'home hero microcopy',
          )
          text = replace_once(
              text,
              'Inquiry Removal is a nationwide hard inquiry removal company helping consumers remove unwanted inquiries from all three major credit reports.',
              'Inquiry Removal is a nationwide hard inquiry removal service helping consumers remove unwanted inquiries from Experian, Equifax, and TransUnion.',
              'home service entity declaration',
          )
          write(p, text)

          # 2) TransUnion: align high-impression Search Console intent with natural headings/FAQs.
          p = 'src/data/guides.ts'
          text = read(p)
          text = replace_once(
              text,
              'heading: "How can you remove a hard inquiry from TransUnion?",',
              'heading: "How Do You Remove Hard Inquiries From TransUnion?",',
              'TransUnion removal heading',
          )
          text = replace_once(
              text,
              'question: "Can I dispute hard inquiries on TransUnion?",\n        answer:\n          "You can dispute information you believe is inaccurate or does not belong to you. The appropriate method depends on the inquiry and the current TransUnion instructions.",',
              'question: "How Do I Dispute Hard Inquiries on TransUnion?",\n        answer:\n          "Start with the exact TransUnion inquiry entry, identify the company that placed it, document what is inaccurate or does not belong to you, and use the current TransUnion process that fits the facts. Inquiry Removal can handle the dispute communications and follow-through for you.",',
              'TransUnion dispute FAQ',
          )
          marker = '''      {\n        question: "Can dealership inquiries be reviewed?",\n        answer:\n          "Yes. We organize the lenders, dates, reports, and dealership event so the full inquiry cluster can be reviewed together.",\n      },'''
          addition = marker + '''\n      {\n        question: "How Long Do Hard Inquiries Stay on a TransUnion Credit Report?",\n        answer:\n          "Hard inquiries generally remain visible on a credit report for up to two years, although their scoring impact can fade sooner. If a TransUnion inquiry is inaccurate, unauthorized, fraudulent, duplicated, or otherwise questionable, you do not have to simply wait for it to age off before reviewing your options.",\n      },'''
          text = replace_once(text, marker, addition, 'TransUnion how-long FAQ')
          write(p, text)

          # 3) FAQ + Areas pages: capture demonstrated 24-hour, post-removal, and Arizona demand honestly.
          p = 'src/data/pages.ts'
          text = read(p)
          timing = '''      {\n        heading: "How Quickly Can Hard Inquiries Be Removed?",\n        body: [\n          "Some removals can appear in as little as seven days. Many cases take longer and clients should allow up to 90 days. Rare, more complicated situations can extend to 120 days because companies and bureaus respond on different schedules.",\n        ],\n      },'''
          timing_plus = timing + '''\n      {\n        heading: "Can Hard Inquiries Be Removed in 24 Hours?",\n        body: [\n          "A 24-hour removal should not be promised or expected. Some inquiry removals can happen quickly, but Inquiry Removal tells clients that the process may take longer because creditors and credit bureaus respond on different schedules. Our earliest published timing is as little as seven days, not 24 hours.",\n        ],\n      },\n      {\n        heading: "What Happens When a Hard Inquiry Is Removed?",\n        body: [\n          "When a hard inquiry is removed, the entry should no longer appear on the affected credit report after the update is processed. That does not guarantee a particular score increase or approval because credit decisions and scores consider the rest of the credit profile as well.",\n        ],\n      },'''
          text = replace_once(text, timing, timing_plus, 'FAQ 24-hour and post-removal questions')

          nationwide = '''      {\n        heading: "All Three Credit Bureaus. One Focused Removal Process.",\n        body: [\n          "Experian, Equifax, and TransUnion can show different inquiry lists. We work with the reports actually affected in your case and keep the inquiry-removal process organized across all of them.",\n        ],\n        bullets: [\n          "Experian hard inquiries",\n          "Equifax hard inquiries",\n          "TransUnion hard inquiries",\n          "Dealership inquiry clusters",\n          "Unauthorized and identity-theft inquiries",\n          "Duplicate and unexpected hard pulls",\n        ],\n      },'''
          nationwide_plus = nationwide + '''\n      {\n        heading: "Looking for Hard Inquiry Removal in Arizona or Phoenix?",\n        body: [\n          "Inquiry Removal serves Arizona consumers through the same nationwide remote process, including people in Phoenix and throughout the state. You can use the service without visiting an office, and the affected Experian, Equifax, and TransUnion reports determine the scope of the work.",\n        ],\n      },'''
          text = replace_once(text, nationwide, nationwide_plus, 'Arizona service section')

          contact_old = '"Call Inquiry Removal to discuss the inquiries on your credit reports and the circumstances surrounding them. Do not provide Social Security numbers, dates of birth, report logins, payment information, or other highly sensitive information during the initial conversation.",'
          contact_new = '"Call Inquiry Removal or submit the free online inquiry review to discuss the inquiries on your credit reports and the circumstances surrounding them. Do not provide Social Security numbers, dates of birth, report logins, payment information, or other highly sensitive information during the initial conversation or public website form.",'
          text = replace_once(text, contact_old, contact_new, 'contact choice copy')
          write(p, text)

          # 4) How It Works: show the value/process before preparation friction; support online or phone starts; answer 24-hour intent.
          p = 'src/pages/how-it-works.astro'
          text = read(p)
          text = replace_once(
              text,
              '["Free review", "#review"],\n        ["Preparation", "#preparation"],\n        ["Full process", "#full-process"],',
              '["Free review", "#review"],\n        ["Full process", "#full-process"],\n        ["Preparation", "#preparation"],',
              'How It Works jump order',
          )
          text = replace_once(
              text,
              'Start with a call to Inquiry Removal. If you are unsure how many\n            inquiries you have or which category describes them, that is\n            completely fine.',
              'Start with the free online review or call Inquiry Removal. If you are unsure how many\n            inquiries you have or which category describes them, that is\n            completely fine.',
              'How It Works start choice',
          )
          text = replace_once(
              text,
              '"Start by calling Inquiry Removal for a free personal review. A specialist will explain what information is useful, discuss the affected reports, and guide you through the next steps before any paid work begins.",',
              '"Start with the free online inquiry review or call Inquiry Removal. A specialist will explain what information is useful, discuss the affected reports, and guide you through the next steps before any paid work begins.",',
              'How It Works begin FAQ',
          )
          faq_marker = '''  [\n    "How do I begin the process?",\n    "Start with the free online inquiry review or call Inquiry Removal. A specialist will explain what information is useful, discuss the affected reports, and guide you through the next steps before any paid work begins.",\n  ],'''
          faq_add = '''  [\n    "Can hard inquiries be removed in 24 hours?",\n    "Inquiry Removal does not promise 24-hour removals. Some removals can happen quickly, but our earliest published timing is as little as seven days. Many cases require more time because creditors and credit bureaus respond on different schedules.",\n  ],\n''' + faq_marker
          text = replace_once(text, faq_marker, faq_add, 'How It Works 24-hour FAQ')

          prep_re = re.compile(r'(\n    <section class="section preparation-section" id="preparation">.*?\n    </section>)(\n\n    <section\n      class="section full-process-section dark-section"\n      id="full-process"\n    >.*?\n    </section>)', re.S)
          m = prep_re.search(text)
          if not m:
              raise SystemExit('How It Works section order: blocks not found')
          text = text[:m.start()] + m.group(2) + '\n\n' + m.group(1).lstrip('\n') + text[m.end():]
          write(p, text)

          # 5) Pricing: put the actual plans directly after the selector, then loss-aversion context.
          p = 'src/pages/pricing.astro'
          text = read(p)
          text = replace_once(
              text,
              '"Someone with 31 or more total hard inquiries who needs the broadest inquiry-removal scope across the affected reports.",',
              '"Someone with 31, 50, 100, or more total hard inquiries who needs the broadest inquiry-removal scope across the affected reports.",',
              'extensive plan high-volume clarity',
          )
          text = replace_once(
              text,
              'Waiting can mean entering your next application with the same\n            inquiry problem still visible. That may lead to another denial,\n            another delayed goal, or another hard inquiry added before the\n            earlier ones have been addressed.',
              'Waiting can mean entering your next application with the same\n            inquiry section and the same questions about recent credit-seeking\n            activity. You may delay an application, keep explaining an old\n            inquiry cluster, or add new inquiries before the earlier ones have\n            been addressed.',
              'pricing loss-aversion copy',
          )
          section_re = re.compile(r'(\n    <section class="section waiting-cost">.*?\n    </section>)(\n\n    <section class="section pricing-page-plans" id="plans">.*?\n    </section>)', re.S)
          m = section_re.search(text)
          if not m:
              raise SystemExit('Pricing section order: blocks not found')
          text = text[:m.start()] + m.group(2) + '\n\n' + m.group(1).lstrip('\n') + text[m.end():]
          write(p, text)

          # 6) Dealership: improve keyword alignment and keep CTAs credible.
          p = 'src/pages/dealership-inquiries.astro'
          text = read(p)
          text = replace_once(
              text,
              '>Show Me Which Inquiries Can Be Removed <span>→</span></a',
              '>Review My Dealership Inquiries <span>→</span></a',
              'dealership inline CTA',
          )
          text = replace_once(
              text,
              '<h2>How Do We Remove Dealership Hard Inquiries?</h2>',
              '<h2>How Do We Remove Hard Inquiries From a Car Dealership?</h2>',
              'dealership Search Console heading',
          )
          text = replace_once(
              text,
              'The inquiries appeared,\n            my score dropped by about 100 points, and suddenly I could not get\n            approved for things I had qualified for before.',
              'The inquiries appeared,\n            my credit profile changed sharply, and recent inquiry activity began\n            getting in the way of approvals I had qualified for before.',
              'founder credibility copy',
          )
          write(p, text)

          # 7) About: turn trust/authority into a clear next action without overwhelming the story.
          p = 'src/pages/about.astro'
          text = read(p)
          text = replace_once(
              text,
              'A specialist company built from firsthand frustration—and shaped\n            around one narrow mission: helping consumers understand and address\n            unwanted hard inquiries.',
              'A nationwide hard inquiry removal service built from firsthand frustration—and shaped\n            around one narrow mission: helping consumers remove unwanted hard\n            inquiries without managing the process alone.',
              'about commercial positioning',
          )
          about_para = '''          <p>\n            A nationwide hard inquiry removal service built from firsthand frustration—and shaped\n            around one narrow mission: helping consumers remove unwanted hard\n            inquiries without managing the process alone.\n          </p>'''
          about_cta = about_para + '''\n          <div class="button-row">\n            <a class="button" href="/free-inquiry-review/">Get My Free Inquiry Review <span>→</span></a>\n            <a class="text-link text-link--light" href="/how-it-works/">See How It Works <span>↘</span></a>\n          </div>\n          <p class="cta-microcopy">Free personal review. One-time pricing. No monthly membership.</p>'''
          text = replace_once(text, about_para, about_cta, 'about hero CTAs')
          hero_end = '''    </section>\n\n    <section class="section about-origin-section">'''
          proof = '''    </section>\n\n    <section class="trust-ribbon" aria-label="Company proof">\n      <div class="container trust-grid">\n        <div><strong>100,437</strong><span>Inquiries removed</span></div>\n        <div><strong>1,123</strong><span>Clients served</span></div>\n        <div><strong>Since 2015</strong><span>Hard inquiry specialists</span></div>\n        <div><strong>4.9</strong><span>Average client rating</span></div>\n      </div>\n    </section>\n\n    <section class="section about-origin-section">'''
          text = replace_once(text, hero_end, proof, 'about proof ribbon')
          write(p, text)

          # 8) Free Review: use micro-commitment sequencing before requesting contact information.
          p = 'src/pages/free-inquiry-review.astro'
          text = read(p)
          fieldset_re = re.compile(r'(\s*<fieldset\n              class="form-step native-review-step is-active"\n              data-review-step="1".*?</fieldset>)(\s*<fieldset\n              class="form-step native-review-step"\n              data-review-step="2".*?</fieldset>)(\s*<fieldset\n              class="form-step native-review-step"\n              data-review-step="3".*?</fieldset>)(\s*<fieldset\n              class="form-step native-review-step"\n              data-review-step="4".*?</fieldset>)', re.S)
          m = fieldset_re.search(text)
          if not m:
              raise SystemExit('Free review fieldsets not found')
          contact, situation, reports, final = m.groups()

          contact = contact.replace('class="form-step native-review-step is-active"', 'class="form-step native-review-step"', 1)
          contact = contact.replace('data-review-step="1"', 'data-review-step="3"', 1)
          contact = contact.replace('tabindex="-1"\n            >', 'tabindex="-1"\n              hidden\n            >', 1)

          situation = situation.replace('class="form-step native-review-step"', 'class="form-step native-review-step is-active"', 1)
          situation = situation.replace('data-review-step="2"', 'data-review-step="1"', 1)
          situation = situation.replace('tabindex="-1"\n              hidden\n            >', 'tabindex="-1"\n            >', 1)

          reports = reports.replace('data-review-step="3"', 'data-review-step="2"', 1)
          final = final.replace('data-review-step="4"', 'data-review-step="4"', 1)
          reordered = situation + '\n' + reports + '\n' + contact + '\n' + final
          text = text[:m.start()] + reordered + text[m.end():]

          text = replace_once(
              text,
              'const reviewStageNames = [\n      "Contact",\n      "Your situation",\n      "Your reports",\n      "Final details",\n    ];',
              'const reviewStageNames = [\n      "Your situation",\n      "Your reports",\n      "Contact",\n      "Final details",\n    ];',
              'free review stage names',
          )
          text = replace_once(
              text,
              'if (reviewStep === 1 && field.name === "entry.1481812974") {\n        guideTo(".native-field-heading");\n      }\n      if (reviewStep === 1 && field.name === "entry.1677473071") {\n        scheduleReviewAdvance();\n      }\n      if (reviewStep === 2 && field.name === "entry.1354254818") {\n        guideTo("[data-bureau-group]");\n      }\n      if (reviewStep === 2 && field.name === "entry.1594186053") {\n        scheduleReviewAdvance();\n      }',
              'if (reviewStep === 0 && field.name === "entry.1481812974") {\n        guideTo(".native-field-heading");\n      }\n      if (reviewStep === 0 && field.name === "entry.1677473071") {\n        scheduleReviewAdvance();\n      }\n      if (reviewStep === 1 && field.name === "entry.1354254818") {\n        guideTo("[data-bureau-group]");\n      }\n      if (reviewStep === 1 && field.name === "entry.1594186053") {\n        scheduleReviewAdvance();\n      }',
              'free review auto advance indexes',
          )
          text = replace_once(
              text,
              '<h1>Let’s Start With What Happened.</h1>',
              '<h1>Tell Us About the Hard Inquiries You Want Removed.</h1>',
              'free review outcome H1',
          )
          text = replace_once(
              text,
              'Every inquiry situation begins with context. Tell us what you see,\n            what you remember, and what you are working toward next.',
              'Start with a few quick questions about the inquiries, the affected\n            reports, and what you want to accomplish. It takes about two minutes,\n            and you will not be asked for payment or sensitive account information.',
              'free review hero reassurance',
          )
          write(p, text)

          # Sanity checks: no temporary workflow edits beyond this file; intended phrases present.
          checks = {
              'src/pages/index.astro': ['nationwide hard inquiry removal service', 'One-time pricing starts at $199'],
              'src/data/guides.ts': ['How Do You Remove Hard Inquiries From TransUnion?', 'How Long Do Hard Inquiries Stay on a TransUnion Credit Report?'],
              'src/data/pages.ts': ['Can Hard Inquiries Be Removed in 24 Hours?', 'Looking for Hard Inquiry Removal in Arizona or Phoenix?'],
              'src/pages/how-it-works.astro': ['Can hard inquiries be removed in 24 hours?', 'free online inquiry review or call Inquiry Removal'],
              'src/pages/pricing.astro': ['31, 50, 100, or more'],
              'src/pages/dealership-inquiries.astro': ['How Do We Remove Hard Inquiries From a Car Dealership?', 'Review My Dealership Inquiries'],
              'src/pages/about.astro': ['nationwide hard inquiry removal service', 'Get My Free Inquiry Review'],
              'src/pages/free-inquiry-review.astro': ['Tell Us About the Hard Inquiries You Want Removed.', '"Your situation",\n      "Your reports",\n      "Contact"'],
          }
          for path, needles in checks.items():
              data = read(path)
              for needle in needles:
                  if needle not in data:
                      raise SystemExit(f'{path}: missing expected QA phrase: {needle}')
          PY

      - name: Commit QA changes
        shell: bash
        run: |
          git config user.name "Inquiry Removal QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine conversion flow and Search Console keyword placement"
          git push origin HEAD:conversion-qa-2026-08-20
