name: Fix conversion meta parser

on:
  push:
    branches:
      - conversion-copy-overhaul-2026-08-20

permissions:
  contents: write

jobs:
  fix-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conversion-copy-overhaul-2026-08-20
          fetch-depth: 0
      - name: Normalize eligibility meta description
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('src/data/pages.ts')
          text = p.read_text()
          old = "Hard inquiry removal starts with the entries you want gone. Show us what happened, and we'll review the reports and explain the removal path."
          new = "Hard inquiry removal starts with the entries you want gone. Show us what happened, and we will review the reports and explain the removal path."
          if text.count(old) != 1:
              raise SystemExit(f'Expected one eligibility description, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
      - name: Commit meta parser fix
        shell: bash
        run: |
          git config user.name "Inquiry Removal Copy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/pages.ts
          git commit -m "Normalize eligibility search snippet"
          git push origin HEAD:conversion-copy-overhaul-2026-08-20
