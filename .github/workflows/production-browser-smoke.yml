name: Production Browser Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"
  deployment_status:
  push:
    branches:
      - main
    paths:
      - "scripts/browser-smoke.mjs"
      - ".github/workflows/production-browser-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install transient browser test dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1 @axe-core/playwright@4.13.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production browser and accessibility smoke tests
        env:
          SITE_URL: https://www.inquiryremoval.com
        run: node scripts/browser-smoke.mjs

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-browser-smoke
          path: .artifacts/browser-smoke
          if-no-files-found: ignore
          retention-days: 7
