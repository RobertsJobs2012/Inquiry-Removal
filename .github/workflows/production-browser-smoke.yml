name: Production Browser Smoke

on:
  workflow_dispatch:
  # Test-only edits intentionally skip Vercel builds. Run the updated checks
  # against the current production site without waiting for another release.
  push:
    branches: [main]
    paths:
      - scripts/browser-smoke.mjs
      - scripts/visual-regression.mjs
      - tests/visual-baselines/**
      - .github/workflows/production-browser-smoke.yml
  schedule:
    - cron: "17 12 * * *"
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install transient browser test dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1 @axe-core/playwright@4.13.0 lighthouse@13.5.0 pixelmatch@8.0.0 pngjs@7.0.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production browser and accessibility smoke tests
        env:
          SITE_URL: https://www.inquiryremoval.com
        run: node scripts/browser-smoke.mjs

      - name: Record initial visual snapshots for review
        env:
          SITE_URL: https://www.inquiryremoval.com
          VISUAL_MODE: record
        run: node scripts/visual-regression.mjs

      - name: Enforce three-run mobile performance budgets
        env:
          SITE_URL: https://www.inquiryremoval.com
        run: node scripts/lighthouse-budgets.mjs

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-browser-smoke
          path: .artifacts/browser-smoke
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-snapshots
          path: .artifacts/visual
          retention-days: 7
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lighthouse-budgets
          path: .artifacts/performance
          retention-days: 7
