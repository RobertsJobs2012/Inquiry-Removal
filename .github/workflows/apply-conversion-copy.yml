name: Apply conversion copy overhaul

on:
  push:
    branches:
      - conversion-copy-overhaul-2026-08-20

permissions:
  contents: write

jobs:
  apply-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conversion-copy-overhaul-2026-08-20
          fetch-depth: 0

      - name: Rewrite conversion copy
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import re

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {found}: {old[:90]!r}")
              p.write_text(text.replace(old, new))

          def get_slug_block(text, slug):
              marker = f'    slug: "{slug}",'
              pos = text.find(marker)
              if pos < 0:
                  return None, None, None
              start = text.rfind('  {\n', 0, pos)
              nxt = text.find('\n  {\n    slug:', pos + len(marker))
              end = nxt if nxt >= 0 else text.rfind('\n];')
              return start, end, text[start:end]

          def set_string(block, field, value, required=True):
              pattern = rf'(\n    {re.escape(field)}:\s*)"(?:\\.|[^"\\])*"(?=,)'
              out, n = re.subn(pattern, lambda m: m.group(1) + json.dumps(value), block, count=1)
              if required and n != 1:
                  raise SystemExit(f"Could not replace field {field}")
              return out

          def set_takeaways(block, items):
              pattern = r'\n    takeaways: \[\n.*?\n    \],'
              body = '\n    takeaways: [\n' + ''.join(f'      {json.dumps(x)},\n' for x in items) + '    ],'
              out, n = re.subn(pattern, body, block, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit('Could not replace takeaways')
              return out

          def set_first_section(block, heading, paragraphs):
              s = block.find('\n    sections: [')
              e = block.find('\n    faqs:', s)
              if s < 0 or e < 0:
                  raise SystemExit('Could not find sections/faqs')
              before, sec, after = block[:s], block[s:e], block[e:]
              sec, n1 = re.subn(
                  r'(\n        heading:\s*)"(?:\\.|[^"\\])*"(?=,)',
                  lambda m: m.group(1) + json.dumps(heading),
                  sec,
                  count=1,
              )
              new_body = '\n        body: [\n' + ''.join(f'          {json.dumps(x)},\n' for x in paragraphs) + '        ],'
              sec, n2 = re.subn(r'\n        body: \[\n.*?\n        \],', new_body, sec, count=1, flags=re.S)
              if n1 != 1 or n2 != 1:
                  raise SystemExit(f'Could not replace first section: heading={n1} body={n2}')
              return before + sec + after

          def update_guide(slug, fields, takeaways, first_heading, first_body):
              p = Path('src/data/guides.ts')
              text = p.read_text()
              start, end, block = get_slug_block(text, slug)
              if block is None:
                  raise SystemExit(f'Missing guide slug {slug}')
              for field, value in fields.items():
                  block = set_string(block, field, value)
              block = set_takeaways(block, takeaways)
              block = set_first_section(block, first_heading, first_body)
              p.write_text(text[:start] + block + text[end:])

          def replace_page_sections(slug, title=None, description=None, aside=None, sections=None):
              p = Path('src/data/pages.ts')
              text = p.read_text()
              start, end, block = get_slug_block(text, slug)
              if block is None:
                  raise SystemExit(f'Missing page slug {slug}')
              if title is not None:
                  block = set_string(block, 'title', title)
              if description is not None:
                  block = set_string(block, 'description', description)
              if aside is not None:
                  pattern = r'\n    aside: \[(?:.|\n)*?\],\n    sections:'
                  aside_text = '\n    aside: [' + ', '.join(json.dumps(x) for x in aside) + '],\n    sections:'
                  block, n = re.subn(pattern, aside_text, block, count=1)
                  if n != 1:
                      raise SystemExit(f'Could not replace aside for {slug}')
              if sections is not None:
                  pos = block.find('\n    sections: [')
                  if pos < 0:
                      raise SystemExit(f'Could not find sections for {slug}')
                  # sections is the final property on these simple hub pages.
                  end_sections = block.rfind('\n    ],')
                  if end_sections < pos:
                      raise SystemExit(f'Could not find section end for {slug}')
                  sec_text = '\n    sections: [\n'
                  for heading, bodies, bullets in sections:
                      sec_text += '      {\n'
                      sec_text += f'        heading: {json.dumps(heading)},\n'
                      sec_text += '        body: [\n'
                      for body in bodies:
                          sec_text += f'          {json.dumps(body)},\n'
                      sec_text += '        ],\n'
                      if bullets:
                          sec_text += '        bullets: [\n'
                          for bullet in bullets:
                              sec_text += f'          {json.dumps(bullet)},\n'
                          sec_text += '        ],\n'
                      sec_text += '      },\n'
                  sec_text += '    ],'
                  block = block[:pos] + sec_text + block[end_sections + len('\n    ],'):]
              p.write_text(text[:start] + block + text[end:])

          # HOMEPAGE: keep keyword ownership, strengthen outcome, mechanism and offer.
          replace(
              'src/pages/index.astro',
              'const heroDescription =\n  "Inquiry Removal helps people remove unwanted hard inquiries from Experian, Equifax, and TransUnion. Hard inquiry removal is not one item buried inside a larger credit repair program. It is our entire focus. We review what happened, identify the inquiries you want removed, and manage the removal process from start to finish. Whether the inquiries came from a dealership, identity theft, a misleading “soft pull,” or a lender you do not recognize, your first step is a free, personal review.";',
              'const heroDescription =\n  "Inquiry Removal is built for people who want hard inquiries gone without managing the dispute process themselves. You show us the inquiries and tell us what happened. We take it from there by organizing the report entries, preparing and sending dispute communications, reviewing responses, tracking removals, and continuing the follow-through. Whether you have 10 inquiries or 100 or more, our one-time packages are based on the total number you want included.";'
          )
          replace('src/pages/index.astro', '<h1>Hard Inquiry Removal Across Experian, Equifax & TransUnion</h1>', '<h1>Remove Hard Inquiries From All 3 Credit Reports With Expert Help</h1>')
          replace(
              'src/pages/index.astro',
              '''          <p class="hero-summary">\n            A focused hard inquiry removal service for unwanted inquiries across\n            Experian, Equifax, and TransUnion—with a free personal review to begin.\n          </p>''',
              '''          <p class="hero-summary">\n            Hard inquiries are all we do. We handle the removal process across\n            Experian, Equifax, and TransUnion so you do not have to manage it alone.\n          </p>'''
          )
          replace('src/pages/index.astro', 'Which Hard Inquiry Situations Do We Handle?', 'Which Hard Inquiries Do You Want Removed?')
          replace(
              'src/pages/index.astro',
              '''            Inquiry Removal handles the situations that cause people to search\n            for hard inquiry removal in the first place. We look at what\n            happened, which bureaus are affected, and the best removal path for\n            the inquiries on your reports.''',
              '''            Dealership inquiries, unauthorized pulls, identity theft, duplicate\n            entries, unexpected hard pulls, and unfamiliar creditor names are\n            exactly why people come to us. Show us the inquiries you want gone,\n            and we will organize the situation and handle the removal process.'''
          )
          replace('src/pages/index.astro', 'Why Choose a Company That Only Removes Inquiries?', 'One Problem. One Specialty. One Focus: Hard Inquiry Removal.')
          replace(
