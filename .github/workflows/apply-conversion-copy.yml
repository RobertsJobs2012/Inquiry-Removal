                      'quickTitle': 'Ready to clean up the Equifax inquiries?',
                      'quickAnswer': 'If Equifax hard inquiries are cluttering a credit profile you worked hard to build, you do not have to manage them yourself. Inquiry Removal focuses only on hard inquiries and handles the removal process from the first review through the responses and follow-through.',
