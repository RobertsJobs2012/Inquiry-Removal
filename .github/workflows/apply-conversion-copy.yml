          replace('src/pages/index.astro', 'Choose the Inquiry Removal Plan That Fits Your Reports', 'Choose Your Hard Inquiry Removal Package')
          replace(
              'src/pages/index.astro',
              '''            Your price is based on the total number of hard inquiries across the\n            credit reports included in your service. Every option is a one-time\n            price, not a monthly subscription.''',
              '''            Pick the one-time package that matches how many hard inquiries you\n            want us to handle. Whether you have a targeted list or 31 or more,\n            every package includes the affected bureaus and continued follow-through.'''
          )

          # DEALERSHIP MONEY PAGE.
          replace('src/pages/dealership-inquiries.astro', '<h1>Dealership Inquiry Removal Across All Three Credit Reports</h1>', '<h1>Remove Dealership Hard Inquiries From All 3 Credit Reports</h1>')
          replace(
              'src/pages/dealership-inquiries.astro',
              '''          <p>\n            Dealership inquiry removal starts with understanding how one\n            application became a list of lender inquiries. We review\n            dealership-related entries across Experian, Equifax, and TransUnion\n            and organize what deserves closer review.\n          </p>''',
              '''          <p>\n            One dealership visit can leave a trail of lender inquiries across\n            Experian, Equifax, and TransUnion. Show us the dealership inquiries\n            you want gone. We organize the lenders, handle the dispute process,\n            review the responses, and keep the removal process moving for you.\n          </p>'''
          )

          # HOW IT WORKS: sell relief and done-for-you execution, not a lesson.
          replace(
              'src/pages/how-it-works.astro',
              'const heroDescription =\n  "The hard inquiry removal process starts with a real conversation about what happened and ends with clear follow-through on every response. You provide the affected credit reports and tell us which inquiries you want removed. Inquiry Removal organizes the information, prepares and sends the disputes, reviews incoming decisions, tracks removals, and completes additional rounds as needed. You stay informed by phone, text, or email, without learning a complicated portal or handling the process by yourself.";',
              'const heroDescription =\n  "You do not need to learn the dispute process or chase every lender and credit bureau yourself. Give us the affected reports, tell us which inquiries you want removed, and we handle the work from there. Inquiry Removal organizes the entries, prepares and sends the disputes, reviews incoming responses, tracks removals, and continues additional follow-through as needed. You stay informed by phone, text, or email while we keep the process organized.";'
          )
          replace('src/pages/how-it-works.astro', '<h1>How Hard Inquiry Removal Works From Start to Finish</h1>', '<h1>We Handle Hard Inquiry Removal From Start to Finish</h1>')
          replace(
              'src/pages/how-it-works.astro',
              '''        <p class="hero-summary">\n          A clear, guided process from your free review through dispute\n          preparation, follow-through, and confirmed results.\n        </p>''',
              '''        <p class="hero-summary">\n          You bring the reports. We organize the inquiries, send the disputes,\n          review the responses, track removals, and handle the follow-through.\n        </p>'''
          )
          replace('src/pages/how-it-works.astro', 'How Does the Hard Inquiry Removal Process Work?', 'What Do We Handle During the Hard Inquiry Removal Process?')
          replace(
              'src/pages/how-it-works.astro',
              '''            The process follows a clear sequence: review the reports, organize\n            the inquiries, prepare and send the disputes, evaluate every\n            response, and continue the follow-through. Inquiry Removal manages\n            these steps for you.''',
              '''            We handle the work people usually do not want to manage themselves: report\n            review, inquiry organization, dispute preparation and sending, response\n            review, removal tracking, and continued follow-through across the affected bureaus.'''
          )
          replace('src/pages/how-it-works.astro', 'Talk through the process with a specialist.', 'Ready to let a specialist handle the process?')
          replace('src/pages/how-it-works.astro', 'Begin with your affected reports, the inquiries you want reviewed, and a clear explanation of what happened.', 'Start with the affected reports and the inquiries you want removed. We will explain the package and take the process from there.')

          # PRICING: make the package decision immediate.
          replace('src/pages/pricing.astro', '<h1>Hard Inquiry Removal Pricing With Zero Monthly Fees</h1>', '<h1>Hard Inquiry Removal Starts at $199 With Zero Monthly Fees</h1>')
          replace(
              'src/pages/pricing.astro',
              '''        <p class="hero-summary">\n          Choose from three one-time plans based on your inquiry count—with no\n          monthly membership fees.\n        </p>''',
              '''        <p class="hero-summary">\n          Choose the one-time package that matches how many hard inquiries you\n          want us to handle. All affected bureaus are included.\n        </p>'''
          )
          replace('src/pages/pricing.astro', 'Talk With a Specialist <span>→</span>', 'Start My Free Review <span>→</span>', expected=1)

          # SITUATIONS HUB: turn categorization into a sales router.
          replace('src/pages/situations-we-handle.astro', '<h1>Hard Inquiry Situations We Handle Across All Three Bureaus</h1>', '<h1>Find Your Hard Inquiry Situation and Start the Removal Process</h1>')
          replace(
              'src/pages/situations-we-handle.astro',
              '''        <p>\n          Hard inquiry situations can come from very different events, and the\n          right next step depends on what actually happened. People come to\n          Inquiry Removal after dealerships send applications to multiple\n          lenders, companies run unexpected hard pulls, identity thieves apply\n          for credit, duplicate inquiries appear, or unfamiliar names show up\n          on their reports. We also help people who remember applying but still\n          want their inquiries examined for removal. Find the situation that\n          sounds like yours, then get a free review built around what actually\n          happened.\n        </p>''',
              '''        <p>\n          Dealership shotgunning, unauthorized pulls, identity theft, duplicate\n          inquiries, unexpected hard pulls, unfamiliar creditor names, or an\n          inquiry you simply want reviewed for removal: this is what we do. Find\n          the situation closest to yours, then let Inquiry Removal handle the\n          process across every affected credit bureau.\n        </p>'''
          )
          replace('src/pages/situations-we-handle.astro', 'Which Hard Inquiry Situation Brought You Here?', 'What Put the Hard Inquiries on Your Credit Reports?')
          replace('src/pages/situations-we-handle.astro', 'What Happened to Your Credit Report?', 'Find the Situation. We Will Handle the Removal Process.')
          replace(
              'src/pages/situations-we-handle.astro',
              '''            Different events can leave similar-looking inquiries behind. The\n            right starting point is the real story behind the names, dates, and\n            bureau entries on your reports.''',
              '''            Pick the situation that sounds like yours. You do not need to know\n            the dispute rules or diagnose the inquiry before contacting us. Tell\n            us what happened and show us the entries you want addressed.'''
          )
          replace('src/pages/situations-we-handle.astro', 'How Does Inquiry Removal Work Across All Three Bureaus?', 'How Do We Handle Inquiry Removal Across All Three Bureaus?')
          replace(
              'src/pages/situations-we-handle.astro',
              '''            Inquiry Removal works with hard inquiries appearing on Experian,\n            Equifax, and TransUnion reports. We build the case around the\n            bureaus actually affected and continue reviewing responses as the\n            removal process moves forward.''',
              '''            We work across Experian, Equifax, and TransUnion. You show us the\n            affected reports, and we organize the inquiries, send the disputes,\n            review responses, track removals, and continue the follow-through.'''
          )

          # GUIDE SERVICE PAGES: retain search intent, make the first screen a service pitch.
          bureau_copy = {
              'experian-hard-inquiry-removal': {
                  'fields': {
                      'title': 'Remove Hard Inquiries From Experian With Specialist Help',
                      'description': 'Remove hard inquiries from Experian with a service focused only on inquiry removal. We handle the dispute process and follow-through. Free review.',
                      'supporting': 'Hard inquiries are all we do. Show us the Experian inquiries you want removed, tell us what happened, and we handle the removal process from review through disputes, responses, and follow-through.',
                      'primaryCta': 'Start My Free Experian Review',
                      'secondaryCta': 'See One-Time Pricing',
                      'secondaryTarget': '/pricing/',
                      'quickTitle': 'Want the Experian inquiries gone?',
                      'quickAnswer': 'If hard inquiries on your Experian report are getting in the way, you do not have to manage the removal process alone. Inquiry Removal specializes exclusively in hard inquiries and handles the report review, dispute communications, responses, and follow-through for you.',
                  },
                  'takeaways': [
                      'Experian hard inquiry removal is one of our core specialist services.',
                      'We handle the dispute communications and response follow-through for you.',
                      'One-time packages start at $199 and are based on total inquiry count.',
                      'Your free review starts with the inquiries you want removed and what happened.',
                  ],
                  'heading': 'Which Experian Hard Inquiries Do You Want Removed?',
                  'body': [
                      'Maybe you have one Experian inquiry you want gone, a dealership cluster, an unexpected hard pull, or a long list of inquiries standing between you and your next application. Start with the entries on your report and what happened.',
                      'You do not need to figure out the removal process before contacting us. Inquiry Removal organizes the inquiry list, handles the communications, and stays involved through the responses and follow-through.',
                  ],
              },
              'equifax-hard-inquiry-removal': {
                  'fields': {
                      'title': 'Remove Hard Inquiries From Equifax With Specialist Help',
                      'description': 'Remove hard inquiries from Equifax with focused specialist help. We handle the dispute process, responses, and follow-through. Free review.',
                      'supporting': 'Show us the Equifax inquiries you want removed and tell us what happened. We organize the entries, handle the dispute communications, review responses, and keep the removal process moving.',
                      'primaryCta': 'Start My Free Equifax Review',
