              '''        <h2>{page.kind === "service" ? "Ready to Start Removing the Hard Inquiries on Your Report?" : "Ready to Review the Inquiries on Your Report?"}</h2>\n        <p>\n          {page.kind === "service"\n            ? "Start with a free review. We will organize the inquiries you want removed, confirm the package that matches your total count, and handle the process from there."\n            : "Start with the exact companies, dates, bureaus, and circumstances, then choose the next step that fits your situation."}\n        </p>'''
