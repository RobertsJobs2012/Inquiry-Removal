          replace(
              'src/components/GuidePage.astro',
              '''          <h2>{page.eyebrow} questions.</h2>\n          <p>Clear answers without promises the facts cannot support.</p>''',
              '''          <h2>{page.kind === "service" ? "Questions Before You Start" : `${page.eyebrow} questions.`}</h2>\n          <p>{page.kind === "service" ? "Straight answers about the service, packages, timing, bureaus, and what happens next." : "Clear answers about the topic and your available next steps."}</p>'''
