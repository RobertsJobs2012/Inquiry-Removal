name: Notify Changed Production URLs
on:
  workflow_dispatch:
  # deployment_status has no branch ref, so GitHub cannot persist a cache for
  # it. A successful production smoke run provides a main-branch event and
  # confirms that the changed deployment is actually live before notifying.
  workflow_run:
    workflows: [Production Browser Smoke]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: indexnow-production
  cancel-in-progress: false
jobs:
  notify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Restore the last accepted public-page fingerprints
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .artifacts/indexnow/state.json
          key: indexnow-production-${{ github.run_id }}
          restore-keys: indexnow-production-
      - name: Notify only actual changed live canonical pages
        run: node scripts/submit-indexnow.mjs --live
