name: Dependency Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 15 * * 1"
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Verify deterministic install and install-script policy
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  credential-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete tracked history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Scan with a checksum-verified pinned Gitleaks release
        run: node scripts/run-secret-scan.mjs
      - name: Upload finding locations only, never matched credential values
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: credential-scan
          path: .artifacts/security/gitleaks.json
          retention-days: 7
