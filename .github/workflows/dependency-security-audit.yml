name: Dependency Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 15 * * 1"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/dependency-security-audit.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/dependency-security-audit.yml"

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Verify deterministic install and install-script policy
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
